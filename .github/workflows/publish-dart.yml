name: Publish (Dart)

# pub.dev trusted publishing accepts only tag pushes, never workflow_dispatch:
# push `<package>-v<version>` (e.g. `codeality_dart-v0.1.0`) to publish. The
# first release of each package is published by hand; see CLAUDE.md.
on:
  push:
    tags:
      - 'codeality_lints-v[0-9]+.[0-9]+.[0-9]+'
      - 'codeality_dart-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.map.outputs.directory }}
    steps:
      - id: map
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            codeality_lints-v*) echo "directory=packages/codeality-dart-lints" >> "$GITHUB_OUTPUT" ;;
            codeality_dart-v*) echo "directory=packages/codeality-dart" >> "$GITHUB_OUTPUT" ;;
            *) echo "no package for tag $TAG" >&2; exit 1 ;;
          esac

  # The reusable publish workflow runs only `pub get` and a dry run, so the
  # package's own checks run here first, against the tagged commit.
  verify:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      DIRECTORY: ${{ needs.resolve.outputs.directory }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6
          # No cache in a release workflow: a poisoned cache would ship.
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: The tag matches the pubspec version
        run: |
          version=$(sed -n 's/^version: //p' "$DIRECTORY/pubspec.yaml")
          if [ "${TAG##*-v}" != "$version" ]; then
            echo "tag $TAG does not match $DIRECTORY version $version" >&2
            exit 1
          fi

      - name: Verify the package
        run: |
          if [ "$DIRECTORY" = packages/codeality-dart-lints ]; then
            packages/codeality-dart-lints/tool/verify_lints.sh
          else
            cd "$DIRECTORY"
            dart pub get
            dart run bin/codeality_dart.dart gate
          fi

  publish:
    needs: [resolve, verify]
    permissions:
      contents: read
      # Trusted publishing: no token, no credentials file, no local login.
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: ${{ needs.resolve.outputs.directory }}
