name: Publish (Python)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Python package to publish
        required: true
        type: choice
        options:
          - codeality-py

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing: no token, no twine credentials, no local login.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Check the lockfile is current
        run: uv lock --check
        working-directory: packages/${{ inputs.package }}

      - name: Run the quality gate
        run: |
          uv sync --locked
          uv run codeality-py gate
        working-directory: packages/${{ inputs.package }}

      - name: Build the distributions
        run: uv build
        working-directory: packages/${{ inputs.package }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/${{ inputs.package }}/dist
