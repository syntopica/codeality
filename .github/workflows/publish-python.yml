name: Publish (Python)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Python package to publish
        required: true
        type: choice
        options:
          - codeality-py

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing: no token, no twine credentials, no local login.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check the lockfile is current
        run: uv lock --check
        working-directory: packages/${{ inputs.package }}

      - name: Run the quality gate
        run: |
          uv sync --locked
          uv run codeality-py gate
        working-directory: packages/${{ inputs.package }}

      - name: Build the distributions
        run: uv build
        working-directory: packages/${{ inputs.package }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/${{ inputs.package }}/dist
