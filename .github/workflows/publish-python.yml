name: Publish (Python)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Python package to publish
        required: true
        type: choice
        options:
          - baseline-py

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing: no token, no twine credentials, no local login.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check
        working-directory: packages/${{ inputs.package }}

      - name: Run the quality gate
        run: |
          uv sync --locked
          uv run baseline-py gate
        working-directory: packages/${{ inputs.package }}

      - name: Build the distributions
        run: uv build
        working-directory: packages/${{ inputs.package }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/${{ inputs.package }}/dist
