name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: check:ci
        run: pnpm run check:ci

      # Lighthouse needs every template's built bundle to actually render.
      # The client-side templates validate `import.meta.env` against a Zod
      # schema at module load and throw when a required variable is missing;
      # Vite inlines those values at build time, so a build with no `.env`
      # produced a bundle that threw before mounting and reported NO_FCP.
      # `baseline-env-init` (from @busirocket/quality-config, wired into each
      # template's `prepare` and `perf:check`) seeds `.env` from the committed
      # `.env.example`, which is what makes this step measurable at all.
      - name: Performance budget
        run: pnpm run perf:check

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: check:quality
        run: pnpm run check:quality

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks cannot see a secret committed three commits ago
      # from a shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for
      # organization-owned repos, with no public-repo exemption; this repo has
      # no such secret and the action would abort before scanning anything.
      # Install the official release binary instead and run the same command
      # local `secrets:check` uses. Pinned to a fixed version, not a floating
      # tag, and checksum-verified against the release's own manifest.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: secrets:check
        run: pnpm run secrets:check

      - name: audit:check
        run: pnpm run audit:check

      - name: Workflow lint
        uses: raven-actions/actionlint@v2
