name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. A job that needs more says so itself; nothing
# here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ui-quality's integration tests drive a real Chromium through
      # Playwright, whose browser binaries are not part of the npm package. A
      # runner without them fails every one of those tests with exit 3 and an
      # empty report, which reads as a product bug rather than a missing step.
      - name: Install Playwright Chromium
        run: pnpm --filter @syntopica/ui-quality exec playwright install --with-deps chromium

      - name: check:ci
        run: pnpm run check:ci

      # Lighthouse needs every template's built bundle to actually render.
      # The client-side templates validate `import.meta.env` against a Zod
      # schema at module load and throw when a required variable is missing;
      # Vite inlines those values at build time, so a build with no `.env`
      # produced a bundle that threw before mounting and reported NO_FCP.
      # `baseline-env-init` (from @syntopica/quality-config, wired into each
      # template's `prepare` and `perf:check`) seeds `.env` from the committed
      # `.env.example`, which is what makes this step measurable at all.
      - name: Performance budget
        run: pnpm run perf:check

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: check:quality
        run: pnpm run check:quality

      # The tool that asserts the estate's gates are wired has to pass its own
      # assertion first. Presence-checking used to report this repository as
      # conformant while its own actions were pinned to movable tags.
      - name: Conformance
        run: pnpm run conformance

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # packages/cargo-baseline is a cargo workspace member but has no
      # package.json, so it is not a pnpm workspace member either and
      # `turbo run test` never reaches it. Without this job its suites do not
      # run in CI at all. GitHub's ubuntu runners ship a stable Rust
      # toolchain, so no toolchain action is needed.
      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo test
        run: cargo test --workspace

      # packages/cargo-baseline declares `unwrap_used`/`expect_used`/`panic`
      # as `deny` under [lints.clippy]. Nothing enforced them: this job ran
      # fmt and test only, and the crate is outside the pnpm workspace so
      # `turbo run lint` never reaches it either.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # packages/codeality-py is a uv project outside the pnpm workspace, so
      # `turbo run test` never reaches it, the same way it never reached
      # cargo-baseline. Without this job its suite and its own gate run only
      # on the machine that cut the release.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Lockfiles are current
        run: |
          uv lock --check --project packages/codeality-py
          uv lock --check --project templates/python-package

      - name: codeality-py gate on itself
        run: |
          uv sync --locked --all-groups --project packages/codeality-py
          uv run --project packages/codeality-py codeality-py gate --project packages/codeality-py

      # The template is what every new Python project starts from; it has to
      # pass the gate against the published package, not the working tree.
      - name: codeality-py gate on the template
        working-directory: templates/python-package
        run: |
          uv sync --locked --all-extras --all-groups
          uv run codeality-py gate

  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # packages/codeality-dart and codeality-dart-lints are pub packages
      # outside the pnpm workspace, like codeality-py. Flutter rather than the
      # bare Dart SDK: the flutter-app template and the Flutter lint fixture
      # need it, and its bundled `dart` serves the pure packages.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      # The duplicates stage runs jscpd through npx; the audit stage needs
      # osv-scanner, since `dart pub` has no audit command.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The gate runs format, analyze --fatal-infos and the test suite with
      # its coverage floor, so they are not repeated as separate steps.
      - name: codeality-dart gate on itself
        working-directory: packages/codeality-dart
        run: |
          dart pub get
          dart run bin/codeality_dart.dart gate

      - name: codeality_lints sets load and fire
        run: packages/codeality-dart-lints/tool/verify_lints.sh

      - name: codeality-dart gate on the templates
        run: |
          for template in dart-package flutter-app; do
            (cd "templates/$template" && dart run ../../packages/codeality-dart/bin/codeality_dart.dart gate)
          done

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks cannot see a secret committed three commits ago
      # from a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for
      # organization-owned repos, with no public-repo exemption; this repo has
      # no such secret and the action would abort before scanning anything.
      # Install the official release binary instead and run the same command
      # local `secrets:check` uses. Pinned to a fixed version, not a floating
      # tag, and checksum-verified against the release's own manifest.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: secrets:check
        run: pnpm run secrets:check

      - name: audit:check
        run: pnpm run audit:check

      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      # actionlint checks workflow syntax; zizmor checks workflow security -
      # template injection through `${{ github.event.* }}`, unpinned actions,
      # over-broad GITHUB_TOKEN permissions, dangerous triggers. Neither
      # subsumes the other, and this repo is where the pinning convention it
      # enforces is defined.
      - name: Workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
