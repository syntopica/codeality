name: Publish

# Manually publish one workspace package to npm. Run from the Actions tab (or
# `gh workflow run publish.yml -f package=eslint-config`) and pick the package;
# it publishes the version currently in that package's package.json.
#
# Auth is tokenless via npm Trusted Publishing (OIDC): npmjs.com must list this
# repo (syntopica/codeality) + this workflow (publish.yml) as a trusted publisher
# for each package, with the "npm publish" action allowed and no environment.
# pnpm exchanges the GitHub OIDC id-token for a short-lived publish credential,
# so no NPM_TOKEN is needed. Provenance is generated automatically because this
# repository is public.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (uses the version in its package.json)'
        type: choice
        required: true
        options:
          - eslint-config
          - eslint-plugin-code-policy
          - tsconfig
          - prettier-config
          - create-baseline
          - quality-config
          - db-quality
          - ui-quality
          - test-quality

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version pin: pnpm/action-setup reads it from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify derived version files are in sync
        run: node scripts/sync-versions.mjs --check

      - name: Build package (if it defines a build script)
        working-directory: packages/${{ inputs.package }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            pnpm run build
          else
            echo "No build script; skipping."
          fi

      # Tokenless publish via OIDC trusted publishing. pnpm detects the OIDC
      # environment (id-token: write) and exchanges the id-token for a
      # short-lived credential. --ignore-scripts avoids re-running prepare hooks.
      - name: Publish to npm
        working-directory: packages/${{ inputs.package }}
        # A wait timeout can follow an accepted upload; check npm before retrying.
        run: pnpm publish --no-git-checks --ignore-scripts --access public --publish-wait-timeout 600000

      - name: Publish failed notice
        if: failure()
        run: |
          echo "::warning title=Publish failed::If the publish step failed on auth, confirm npm Trusted Publishing for this package on npmjs.com (Settings -> Trusted publishing) points to organization 'syntopica', repository 'codeality', workflow 'publish.yml', allowed action 'npm publish', and no environment. Also check the version in packages/${{ inputs.package }}/package.json is not already published."
