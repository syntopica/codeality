packages:
  - 'packages/*'
  - 'templates/*'
# Explicit supply-chain allowlist (pnpm 11 `allowBuilds`): only these vetted
# native dependencies may run install/build scripts. Every other dependency's
# install scripts stay blocked (no silent postinstall). Required for CI:
# pnpm errors on un-decided build scripts under `--frozen-lockfile`.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
# Relax the supply-chain release-age cooldown only for Vue's vetted first-party
# type-checking toolchain, whose patch releases we track and adopt immediately.
# Everything else still honors the cooldown.
minimumReleaseAgeExclude:
  - vue-tsc
  - '@vue/language-core'
  - '@nuxt/kit@4.5.0'
  - '@nuxt/nitro-server@4.5.0'
  - '@nuxt/schema@4.5.0'
  - '@nuxt/vite-builder@4.5.0'
  - happy-dom@20.11.0
  - nuxt@4.5.0
  - '@vitest/eslint-plugin@1.6.25'
patchedDependencies:
  eslint-plugin-react: patches/eslint-plugin-react.patch
# Security overrides: `pnpm audit --audit-level=high` findings that survived
# `pnpm dedupe`. Each pins the transitive edge forward to the patched line
# named in its advisory, scoped to the vulnerable range so it does not force
# an unrelated major bump on consumers already resolving the fixed version.
#
# Every entry here is load-bearing: removing it and re-running
# `pnpm install && pnpm audit --audit-level=high` brings its advisory back.
# Re-run that check when the upstream named in the comment moves its own floor.
overrides:
  'tmp@<0.2.6': ^0.2.6 # GHSA-ph9p-34f9-6g65, via @lhci/cli>inquirer>external-editor
  'sharp@<0.35.0': ^0.35.3 # GHSA-f88m-g3jw-g9cj, via templates/nextjs-app's next
  'postcss@<8.5.18': ^8.5.24 # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849, via next
  'ip-address@<10.3.1': ^10.3.1 # GHSA-mwp4-54f8-5fhr, via @lhci/cli>proxy-agent>socks
  # GHSA-rgw5-rvv9-x895 patched each major separately, so one entry per affected
  # line. The ranges are lower-bounded on purpose: `brace-expansion@<2.1.4`
  # would also capture the 1.x edge, which the advisory does not flag, and drag
  # it across two majors.
  'brace-expansion@>=2.0.0 <2.1.4': ^2.1.4 # via nuxt>@nuxt/nitro-server
  'brace-expansion@>=5.0.0 <5.0.9': ^5.0.9 # via eslint>@eslint/config-array>minimatch
  # GHSA-5p4m-2wfm-xmqj is patched in both live majors, so one entry each -
  # a single `js-yaml@<4.3.1` would drag the 3.x line across a major.
  'js-yaml@>=3.0.0 <3.15.1': ^3.15.1 # via @lhci/cli>@lhci/utils
  'js-yaml@>=4.0.0 <4.3.1': ^4.3.1 # via @lhci/cli and astro
  'nanoid@<3.3.18': ^3.3.18 # GHSA-2v37-7h3g-55p8, via prettier-plugin-css-order>postcss
  # GHSA-jmr9-qjv8-65gv has no patched release: extract-zip's latest is the
  # vulnerable 2.0.1. @puppeteer/browsers 3.x dropped the dependency entirely
  # (modern-tar replaced it), so the fix is to move the consumer forward rather
  # than the vulnerable package.
  '@puppeteer/browsers@<3.2.1': ^3.2.1 # via @lhci/cli>lighthouse>puppeteer-core
