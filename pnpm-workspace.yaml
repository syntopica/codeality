packages:
  - 'packages/*'
  - 'templates/*'
# Explicit supply-chain allowlist: only these vetted native dependencies may run
# install/build scripts. Everything else is blocked by pnpm (no silent postinstall).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - unrs-resolver
# Relax the supply-chain release-age cooldown only for Vue's vetted first-party
# type-checking toolchain, whose patch releases we track and adopt immediately.
# Everything else still honors the cooldown.
minimumReleaseAgeExclude:
  - vue-tsc
  - '@vue/language-core'
patchedDependencies:
  eslint-plugin-react: patches/eslint-plugin-react.patch
