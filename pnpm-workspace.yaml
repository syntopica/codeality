packages:
  - 'packages/*'
  - 'templates/*'
# Explicit supply-chain allowlist (pnpm 11 `allowBuilds`): only these vetted
# native dependencies may run install/build scripts. Every other dependency's
# install scripts stay blocked (no silent postinstall). Required for CI:
# pnpm errors on un-decided build scripts under `--frozen-lockfile`.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
# Relax the supply-chain release-age cooldown only for Vue's vetted first-party
# type-checking toolchain, whose patch releases we track and adopt immediately.
# Everything else still honors the cooldown.
minimumReleaseAgeExclude:
  - vue-tsc
  - '@vue/language-core'
  - '@nuxt/kit@4.5.0'
  - '@nuxt/nitro-server@4.5.0'
  - '@nuxt/schema@4.5.0'
  - '@nuxt/vite-builder@4.5.0'
  - happy-dom@20.11.0
  - nuxt@4.5.0
  - '@vitest/eslint-plugin@1.6.25'
patchedDependencies:
  eslint-plugin-react: patches/eslint-plugin-react.patch
# Security overrides: `pnpm audit --audit-level=high` findings that survived
# `pnpm dedupe`. Each pins the transitive edge forward to the patched line
# named in its advisory, scoped to the vulnerable range so it does not force
# an unrelated major bump on consumers already resolving the fixed version.
overrides:
  'tmp@<0.2.6': ^0.2.6 # GHSA-ph9p-34f9-6g65, via @lhci/cli>inquirer>external-editor
  'fast-uri@<3.1.4': ^3.1.4 # GHSA-v2hh-gcrm-f6hx, via astro's language server
  'sharp@<0.35.0': ^0.35.3 # GHSA-f88m-g3jw-g9cj, via templates/nextjs-app's next
  'postcss@<8.5.18': ^8.5.24 # GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849, via next
  'brace-expansion@<1.1.17': ^1.1.17 # GHSA-mh99-v99m-4gvg, via eslint-plugin-import's minimatch@3
