packages:
  - 'packages/*'
  - 'templates/*'
# Explicit supply-chain allowlist (pnpm 11 `allowBuilds`): only these vetted
# native dependencies may run install/build scripts. Every other dependency's
# install scripts stay blocked (no silent postinstall). Required for CI:
# pnpm errors on un-decided build scripts under `--frozen-lockfile`.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Relax the supply-chain release-age cooldown only for Vue's vetted first-party
# type-checking toolchain, whose patch releases we track and adopt immediately.
# Everything else still honors the cooldown.
minimumReleaseAgeExclude:
  - vue-tsc
  - '@vue/language-core'
  - '@nuxt/kit@4.5.0'
  - '@nuxt/nitro-server@4.5.0'
  - '@nuxt/schema@4.5.0'
  - '@nuxt/vite-builder@4.5.0'
  - happy-dom@20.11.0
  - nuxt@4.5.0
patchedDependencies:
  eslint-plugin-react: patches/eslint-plugin-react.patch
