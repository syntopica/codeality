# Sections codeality-py merges into an existing pyproject.toml. It owns these
# tables and nothing else; comments and key order elsewhere are preserved.

# Without known_first_party, deptry reports every internal import as DEP003.
[tool.deptry]
known_first_party = ["CHANGE_ME"]

[tool.deptry.per_rule_ignores]
# pytest-xdist is a pytest plugin, loaded by the -n in addopts, never imported.
DEP002 = ["pytest-xdist"]
# Test tooling legitimately lives in a dev group and is imported only by tests.
DEP004 = ["pytest", "pytest_asyncio", "pytest_cov"]

# One worker per core from the first test, so the suite is written isolated:
# a test that needs a shared port, file or process serialises on a lock in the
# code that uses it, never by ordering. `-n 0` runs in-process for a debugger.
[tool.pytest.ini_options]
addopts = "-ra -n auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[dependency-groups]
quality = [
  "syntopica-codeality-py>=0.1,<1",
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-xdist>=3,<4",
  "ruff>=0.15,<1",
]
