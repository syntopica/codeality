[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "busirocket-baseline-py"
version = "0.1.9"
description = "Structural linter and config scaffolder for Python: atomic files, placement, size caps, no inline SQL"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cristian Deluxe" }]
keywords = ["linter", "code-quality", "architecture", "ast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["click>=8.1,<9", "tomlkit>=0.13,<1"]

[project.scripts]
baseline-py = "baseline_py.cli:cli"

[project.urls]
Homepage = "https://github.com/BusiRocket/baseline"
Issues = "https://github.com/BusiRocket/baseline/issues"

[dependency-groups]
dev = [
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_py"]

[tool.deptry]
known_first_party = ["baseline_py"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

