# Sections baseline-py merges into an existing pyproject.toml. It owns these
# tables and nothing else; comments and key order elsewhere are preserved.

# Without known_first_party, deptry reports every internal import as DEP003.
[tool.deptry]
known_first_party = ["CHANGE_ME"]

[tool.deptry.per_rule_ignores]
DEP002 = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[dependency-groups]
quality = [
  "busirocket-baseline-py>=0.1,<1",
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
]
