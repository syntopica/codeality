# This workflow must live at the REPO ROOT (.github/workflows/), not inside src-tauri/.
# Crate-in-subdir layouts (e.g. Tauri apps) need this under jobs.check:
#   defaults:
#     run:
#       working-directory: src-tauri
# cargo install cargo-baseline --locked needs crates.io; until published: cargo install --git https://github.com/BusiRocket/baseline cargo-baseline
name: baseline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo install cargo-baseline --locked
      - run: cargo baseline check
