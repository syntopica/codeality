<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus hidden</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
        max-width: 640px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      /* The reset that hides the ring and puts nothing back. */
      button,
      input,
      a {
        outline: none;
      }
      button {
        background: #2563eb;
        color: #ffffff;
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        font: inherit;
      }
      input {
        border: 1px solid #6b7280;
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Invoice filters</h1>
      <p><a href="#top">Back to top</a></p>
      <p><input type="text" aria-label="Customer" value="Acme" /></p>
      <p><button type="button">Apply</button></p>
    </main>
  </body>
</html>
