<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composition defects</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
        max-width: 960px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .meta {
        display: flex;
        gap: 8px;
      }
      .meta .sent {
        font-size: 14px;
      }
      .meta .due {
        font-size: 13px;
      }
      .card {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 16px;
        margin: 16px 0;
      }
      .card .card {
        padding: 12px;
      }
      .primary {
        background: #2563eb;
        color: #ffffff;
        border: 0;
        border-radius: 6px;
        padding: 8px 16px;
        font: inherit;
      }
      .stamp {
        position: relative;
        margin-top: -40px;
        height: 48px;
        background: #1e293b;
        color: #ffffff;
      }
      .banner {
        height: 80px;
        background-image: url(missing-banner.png);
      }
      .history {
        height: 900px;
      }
    </style>
    <script>
      // A promotion that arrives after the page has painted, with no space
      // kept for it: everything below jumps.
      window.addEventListener('load', () =>
        setTimeout(() => {
          const promo = document.createElement('img')
          promo.alt = 'Spring offer'
          promo.width = 600
          promo.height = 450
          promo.src = 'pattern.svg'
          document.querySelector('main').prepend(promo)
        }, 100),
      )
    </script>
  </head>
  <body>
    <main>
      <div>
        <h1>Invoice 2041</h1>
        <button class="primary" type="button">New invoice</button>
      </div>
      <div class="meta">
        <span class="sent">Sent on 2 March</span>
        <span class="due">Due on 1 April</span>
      </div>
      <section class="card">
        <h2>Lines</h2>
        <div class="card">
          <p>Consulting, March: 12 hours at 80 euros.</p>
        </div>
        <button class="primary" type="button">Save</button>
      </section>
      <p class="note">Payment terms are thirty days from the invoice date.</p>
      <div class="stamp">Paid in full</div>
      <div class="banner">Thank you for your business</div>
      <section class="history">
        <h2>History</h2>
        <p>Created, sent and paid within the month.</p>
      </section>
    </main>
  </body>
</html>
