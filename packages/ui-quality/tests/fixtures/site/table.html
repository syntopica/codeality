<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A table to sort and search</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 sans-serif;
        color: #000000;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      button,
      input {
        font: inherit;
        color: #000000;
        background: #ffffff;
        border: 1px solid #000000;
        padding: 4px 8px;
      }
      th,
      td {
        padding: 4px 12px;
        text-align: left;
      }
      th button {
        padding: 0 8px;
      }
      td:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Customers</h1>
      <input type="text" placeholder="Search customers" />
      <table>
        <thead>
          <tr>
            <th><button type="button" data-key="name">Name</button></th>
            <th><button type="button" data-key="amount">Amount</button></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty"></p>
      <p>
        <button type="button" id="previous">Previous</button>
        <button type="button" id="next">Next</button>
      </p>
      <form>
        <input name="name" aria-label="New customer" />
        <button type="submit">Add</button>
      </form>
      <p id="status"></p>
    </main>
    <script>
      // With #broken the amount header sorts by a hidden id and the search
      // box ignores what is typed into it. With #silent the search works but
      // an empty result says nothing, "Next" does nothing and a failed save
      // is swallowed.
      const broken = location.hash.startsWith('#broken')
      const silent = location.hash === '#silent'
      const PAGE_SIZE = 3
      let page = 1
      const customers = [
        { id: 3, name: 'Delta Foods', amount: 120 },
        { id: 1, name: 'Alpha Studio', amount: 45.5 },
        { id: 4, name: 'Echo Labs', amount: 1200 },
        { id: 2, name: 'Bravo Shipping', amount: 8 },
        { id: 5, name: 'Charlie Books', amount: 300 },
      ]
      let query = ''
      let sort = null
      const render = () => {
        const rows = customers
          .filter(
            (customer) =>
              broken ||
              customer.name.toLowerCase().includes(query.toLowerCase()),
          )
          .sort((left, right) => {
            if (!sort) return 0
            const key = broken && sort.key === 'amount' ? 'id' : sort.key
            const order =
              typeof left[key] === 'number'
                ? left[key] - right[key]
                : left[key].localeCompare(right[key])
            return sort.descending ? -order : order
          })
        const lastPage = Math.max(1, Math.ceil(rows.length / PAGE_SIZE))
        document.querySelector('#previous').disabled = page === 1
        document.querySelector('#next').disabled = page === lastPage
        const visible = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)
        // Like many apps, an empty result replaces the table rather than
        // emptying it, which is what a search left typed in would hide.
        document.querySelector('table').hidden = visible.length === 0
        document.querySelector('#empty').textContent =
          visible.length === 0 && !silent
            ? 'No customers match this search'
            : ''
        document.querySelector('tbody').innerHTML = visible
          .map(
            (customer) =>
              `<tr><td>${customer.name}</td><td>${customer.amount.toFixed(2)} €</td></tr>`,
          )
          .join('')
      }
      // With #broken-tight the header cells also sit with no whitespace between
      // them, as React renders them: textContent reads "NameAmount" while
      // innerText reads "Name<TAB>Amount".
      if (location.hash === '#broken-tight') {
        document.querySelector('thead tr').innerHTML =
          '<th><button type="button" data-key="name">Name</button></th>' +
          '<th><button type="button" data-key="amount">Amount</button></th>'
      }
      for (const button of document.querySelectorAll('th button')) {
        button.addEventListener('click', () => {
          const key = button.dataset.key
          sort = {
            key,
            descending: sort?.key === key ? !sort.descending : false,
          }
          render()
        })
      }
      document.querySelector('input').addEventListener('input', (event) => {
        query = event.target.value
        page = 1
        render()
      })
      document.querySelector('#next').addEventListener('click', () => {
        if (!silent) page += 1
        render()
      })
      document.querySelector('#previous').addEventListener('click', () => {
        page -= 1
        render()
      })
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault()
        void fetch('/customers', { method: 'POST' })
          .then((response) => {
            if (!response.ok) throw new Error(String(response.status))
          })
          .catch(() => {
            if (silent) return
            const status = document.querySelector('#status')
            status.setAttribute('role', 'alert')
            status.textContent = 'Could not add the customer'
          })
      })
      render()
    </script>
  </body>
</html>
