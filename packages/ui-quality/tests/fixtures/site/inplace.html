<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workspace</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 sans-serif;
        color: #000000;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <!-- A single-page app that renders its sign-in form in place, at any
         address, and swaps in the workspace without navigating. -->
    <main></main>
    <script>
      const main = document.querySelector('main')
      const workspace = () => {
        main.innerHTML = '<h1 id="signed-in">Workspace</h1><p>Signed in.</p>'
      }
      if (localStorage.getItem('session') === 'yes') workspace()
      else {
        main.innerHTML =
          '<h1>Sign in</h1><form><input type="email" name="email" aria-label="Email" /><input type="password" name="password" aria-label="Password" /><button type="submit">Sign in</button></form>'
        main.querySelector('form').addEventListener('submit', (event) => {
          event.preventDefault()
          if (event.target.email.value === '') return
          localStorage.setItem('session', 'yes')
          workspace()
        })
      }
    </script>
  </body>
</html>
