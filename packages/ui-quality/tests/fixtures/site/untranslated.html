<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English keys on a Spanish page</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casilla 29</h1>
      <ul>
        <li><span>rate</span> <span>21 %</span></li>
        <li><span>calculation</span> <span>4,20 €</span></li>
        <li><span>purchase:7905</span> <span>4,20 €</span></li>
        <li><span>taxRate</span> <span>21 %</span></li>
      </ul>
    </main>
  </body>
</html>
