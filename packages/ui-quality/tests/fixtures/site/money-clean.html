<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amounts with a unit</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        justify-content: space-between;
        width: 360px;
        padding: 8px 0;
      }
      table {
        border-collapse: collapse;
        margin-top: 24px;
      }
      td,
      th {
        padding: 8px 16px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casilla 29</h1>
      <ul>
        <li><span>CUOTA 07/2026</span><span>4,20 €</span></li>
        <li><span>CUOTA 08/2026</span><span>10,50 €</span></li>
        <li><span>CUOTA 09/2026</span><span>1.505,69 €</span></li>
      </ul>
      <table>
        <thead>
          <tr>
            <th>Periodo</th>
            <th>Cuota</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>CUOTA 07/2026</td>
            <td>4,20</td>
          </tr>
          <tr>
            <td>CUOTA 08/2026</td>
            <td>10,50</td>
          </tr>
          <tr>
            <td>CUOTA 09/2026</td>
            <td>1.505,69</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
