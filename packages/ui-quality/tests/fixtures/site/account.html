<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 sans-serif;
        color: #000000;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <!-- A signed-in page that changes the password: a password field and no
         username field, which is not a sign-in form. -->
    <main>
      <h1>Account</h1>
      <form>
        <input type="password" aria-label="Current password" />
        <input type="password" aria-label="New password" />
        <button type="submit">Change password</button>
      </form>
    </main>
  </body>
</html>
