<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spanish dates on a Spanish page</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casilla 29</h1>
      <ul>
        <li><span>30/09/2026</span> <span>Cuota de septiembre</span></li>
        <li><span>2026-10-11 Alta en Hacienda de la sociedad</span></li>
        <li><code>2026-09-30</code></li>
        <li><input type="text" aria-label="Fecha" value="2026-09-30" /></li>
      </ul>
    </main>
  </body>
</html>
