<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desktop shell</title>
  </head>
  <body>
    <main>
      <h1 id="greeting">Shell bridge missing</h1>
      <iframe
        title="Message body"
        sandbox="allow-same-origin"
        srcdoc="<p>An email body rendered without scripts.</p>"
      ></iframe>
    </main>
    <script>
      // Stands in for an app that only renders under its desktop shell: the
      // bridge is what an init script stubs.
      if (window.__SHELL_BRIDGE__)
        document.getElementById('greeting').textContent =
          window.__SHELL_BRIDGE__.greeting()
    </script>
  </body>
</html>
