<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monospace prose</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .mono {
        font-family: ui-monospace, monospace;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modelos</h1>
      <h2 class="mono">Casilla 29</h2>
      <ul>
        <li><span>Presentado</span> <span class="mono">Sin dato</span></li>
      </ul>
    </main>
  </body>
</html>
