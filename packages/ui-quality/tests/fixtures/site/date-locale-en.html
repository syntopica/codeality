<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISO dates on an English page</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Box 29</h1>
      <ul>
        <li><span>2026-09-30</span> <span>September fee</span></li>
      </ul>
    </main>
  </body>
</html>
