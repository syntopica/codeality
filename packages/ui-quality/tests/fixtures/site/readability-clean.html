<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy to read</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 24px;
      }
      p {
        max-width: 60ch;
        margin: 0 0 24px;
      }
      .banner {
        margin-bottom: 24px;
        padding: 12px 16px;
        background: #2563eb;
        color: #ffffff;
      }
      .note {
        display: inline-block;
        padding: 4px 12px;
        border: 1px solid #9ca3af;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <div class="banner">Upgrade to unlock more seats</div>
      <p>
        Every invoice is generated on the last day of the month and sent to the
        billing contact of the account. If the contact changes, update it in the
        settings before that day, because a sent invoice cannot be reissued to a
        new address afterwards.
      </p>
      <span class="note">Beta</span>
    </main>
  </body>
</html>
