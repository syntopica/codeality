<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A formula past its panel</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel {
        width: 320px;
        height: 240px;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
        border: 1px solid #d1d5db;
      }
      .wraps {
        overflow-wrap: anywhere;
      }
      pre {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casilla 29</h1>
      <aside class="panel">
        <p>152+03+06+09+11+13+15+158+170+18+21+24+26</p>
      </aside>
    </main>
  </body>
</html>
