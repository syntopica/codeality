<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A select too short for its text</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 sans-serif;
        color: #000000;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      select {
        box-sizing: border-box;
        border: 1px solid #000000;
        font-size: 16px;
        padding: 9px 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Company</h1>
      <!-- 28px of client height less 18px of padding leaves 10px for a
           17px line: Chromium cuts the option's text top and bottom. -->
      <label>
        Tight
        <select style="height: 30px">
          <option>AJN Hostelería ESPJ · E67686287</option>
        </select>
      </label>
      <label>
        Roomy
        <select style="height: 40px; padding-block: 6px">
          <option>AJN Hostelería ESPJ · E67686287</option>
        </select>
      </label>
    </main>
  </body>
</html>
