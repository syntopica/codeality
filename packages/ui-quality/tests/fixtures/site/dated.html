<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>A table sorted by dates written in words</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 sans-serif;
        color: #000000;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      button {
        font: inherit;
        color: #000000;
        background: #ffffff;
        border: 1px solid #000000;
        padding: 0 8px;
      }
      th,
      td {
        padding: 4px 12px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contratos</h1>
      <table>
        <thead>
          <tr>
            <th><button type="button" data-key="iso">Firmado</button></th>
            <th><button type="button" data-key="title">Contrato</button></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script>
      // The dates read as words ("2 jun 2021"), which no text rule can order,
      // but each carries its exact moment in <time datetime>. The contract
      // cell shows a title with a publication date under it: it orders by
      // the title, so that later date must not stand for the cell.
      const rows = [
        {
          iso: '2021-06-02',
          title: 'Orquesta de verano',
          published: '2023-04-01',
        },
        {
          iso: '2023-01-15',
          title: 'Banda de carnaval',
          published: '2020-02-11',
        },
        {
          iso: '2020-11-30',
          title: 'Discomóvil de Navidad',
          published: '2022-10-05',
        },
        {
          iso: '2022-03-08',
          title: 'Charanga de fiestas',
          published: '2021-01-20',
        },
      ]
      const words = (iso) =>
        new Date(`${iso}T12:00:00Z`).toLocaleDateString('es-ES', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
        })
      const time = (iso) => `<time datetime="${iso}">${words(iso)}</time>`
      let sort = null
      const render = () => {
        const shown =
          sort === null
            ? rows
            : rows.toSorted((left, right) => {
                const order = left[sort.key].localeCompare(
                  right[sort.key],
                  'es',
                )
                return sort.descending ? -order : order
              })
        document.querySelector('tbody').innerHTML = shown
          .map(
            (row) =>
              `<tr><td>${time(row.iso)}</td><td>${row.title}<br />Publicado ${time(row.published)}</td></tr>`,
          )
          .join('')
      }
      for (const button of document.querySelectorAll('th button')) {
        button.addEventListener('click', () => {
          const key = button.dataset.key
          sort = {
            key,
            descending: sort?.key === key ? !sort.descending : false,
          }
          render()
        })
      }
      render()
    </script>
  </body>
</html>
