<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A total of one item</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .card {
        width: 360px;
        padding: 16px;
        margin-bottom: 24px;
        border: 1px solid #d1d5db;
      }
      li,
      .total {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
      }
      .total {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casilla 29</h1>
      <section class="card">
        <ul>
          <li><span>CUOTA 09/2026</span><span>4,20 €</span></li>
        </ul>
        <div class="total"><span>Total</span><span>4,20 €</span></div>
      </section>
    </main>
  </body>
</html>
