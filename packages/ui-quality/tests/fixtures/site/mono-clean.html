<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monospace codes</title>
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 24px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .mono {
        font-family: ui-monospace, monospace;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modelos</h1>
      <h2>Casilla 29</h2>
      <ul>
        <li>
          <span>Referencia</span> <span class="mono">CBK26 014434854</span>
        </li>
        <li><span class="mono">2026-09-30 · CUOTA 09/2026</span></li>
        <li><span>Casilla</span> <span class="mono">29</span></li>
        <li><span>Fichero</span> <span class="mono">modelo303.pdf</span></li>
      </ul>
    </main>
  </body>
</html>
