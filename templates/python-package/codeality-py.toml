# codeality-py configuration - https://github.com/syntopica/codeality
schema-version = 1
source-roots = ["src"]
test-roots = ["tests"]
respect-gitignore = true
import-package = "greeting_service"
coverage-threshold = 80
# The gate reports the pytest stage as over-budget past this many seconds.
# A suite that grows past it gets profiled, not more hardware.
test-budget-seconds = 300

[limits]
max-file-lines = 150
test-max-file-lines = 300

# A role states what a file is. Prefer a role over a suppression: it explains
# the file instead of silencing an alarm.
[roles]
entrypoint = ["src/greeting_service/cli.py"]
